name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [storage, api-gateway] # Проверяем оба сервиса
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest # Доустанавливаем линтеры и тесты

      - name: Lint (ruff)
        run: |
          cd ${{ matrix.service }}
          ruff check .

      - name: Types (mypy)
        run: |
          cd ${{ matrix.service }}
          mypy app

      - name: Tests (pytest)
        run: |
          cd ${{ matrix.service }}
          pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: checks # Запустится только если проверки выше прошли успешно
    steps:
      - uses: actions/checkout@v4
      
      - name: Build storage image
        run: docker build -t storage:ci ./storage
        
      - name: Build api-gateway image
        run: docker build -t api-gateway:ci ./api-gateway