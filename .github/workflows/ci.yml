name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    
    # 1. Поднимаем базу данных прямо в CI
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        service: [storage, api-gateway]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Lint (ruff)
        run: |
          cd ${{ matrix.service }}
          ruff check .
        env:
          ST_HOST: "127.0.0.1"
          ST_PORT: "8001"
          ST_DATABASE_URL: "postgresql://appuser:apppass@localhost:5432/appdb"
          GW_HOST: "127.0.0.1"
          GW_PORT: "8000"
          GW_STORAGE_BASE_URL: "http://localhost:8001"
          GW_STORAGE_TIMEOUT_S: "5.0"

      - name: Types (mypy)
        run: |
          cd ${{ matrix.service }}
          mypy app
        env:
          ST_HOST: "127.0.0.1"
          ST_PORT: "8001"
          ST_DATABASE_URL: "postgresql://appuser:apppass@localhost:5432/appdb"
          GW_HOST: "127.0.0.1"
          GW_PORT: "8000"
          GW_STORAGE_BASE_URL: "http://localhost:8001"
          GW_STORAGE_TIMEOUT_S: "5.0"

      - name: Tests (pytest)
        run: |
          cd ${{ matrix.service }}
          pytest -v
        env:
          ST_HOST: "127.0.0.1"
          ST_PORT: "8001"
          ST_DATABASE_URL: "postgresql://appuser:apppass@localhost:5432/appdb"
          GW_HOST: "127.0.0.1"
          GW_PORT: "8000"
          GW_STORAGE_BASE_URL: "http://localhost:8001"
          GW_STORAGE_TIMEOUT_S: "5.0"

  docker-build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      
      - name: Build storage image
        run: docker build -t storage:ci ./storage
        
      - name: Build api-gateway image
        run: docker build -t api-gateway:ci ./api-gateway